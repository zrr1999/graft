name: "CI - PR Checks"

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check PR title
        uses: zendev-lab/zendev/actions/validate-title@8f336868ce2cd685cfa8c62882acefc3acbb4ead # v0.1.0
        with:
          text: ${{ github.event.pull_request.title }}
          profile: zendev

  body:
    name: PR body
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check PR body
        uses: zendev-lab/zendev/actions/validate-body@344af123be2442a48ae791935bf4df5f8fb2539b # v0.1.0
        with:
          body: ${{ github.event.pull_request.body }}
